<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=400, height={{ render_height }}, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        html { width: 400px; height: auto; min-height: 0; }
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: #fdf2f2; 
            margin: 0; padding: 0;
            width: 400px;
        }
        .container { 
            background: white; 
            width: 400px;
            overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); 
            color: white; padding: 20px; 
            text-align: center; font-size: 20px; font-weight: bold; 
            height: 67px; line-height: 27px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item { 
            display: flex; 
            align-items: center; 
            padding: 0 15px;         /* 去掉上下 padding，靠 height 撑开 */
            height: 62px;
            border-bottom: 1px solid #fff0f0; 
            box-sizing: border-box;  /* 确保 border 不额外增加高度 */
        }
        .rank { font-style: italic; font-weight: bold; width: 30px; color: #ffb3ba; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; margin: 0 12px; }
        .name { flex: 1; font-size: 15px; color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .count-tag { background: #ffe5e5; color: #ff6b6b; padding: 3px 10px; border-radius: 10px; font-size: 12px; }
        .footer { height: 35px; line-height: 15px; padding: 10px; text-align: center; font-size: 11px; color: #ff9a9e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">{{ title }}</div>
        {% for user in ranking %}
        <div class="item">
            <div class="rank">#{{ user.rank }}</div>
            <img class="avatar" src="{{ user.avatar_url or 'data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20100%20100%27%3E%3Ccircle%20cx=%2750%27%20cy=%2750%27%20r=%2750%27%20fill=%27%23ddd%27/%3E%3C/svg%3E' }}">
            <div class="name">{{ user.name }}</div>
            <div class="count-tag">被强娶 {{ user.count }} 次</div>
        </div>
        {% endfor %}
        <div class="footer">数据统计范围：最近30天</div>
    </div>
</body>
</html>
