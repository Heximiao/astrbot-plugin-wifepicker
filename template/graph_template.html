<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script>
        {{ vis_js_content | safe }}
    </script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }

        #network-container {
            width: 100%;
            /* 预留 80px 给 header，保证不和图谱重叠 */
            height: calc(100vh - 80px);
            position: relative;
        }

        .header {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #000000;
            font-size: 32px;
            font-weight: bold;
            background-color: #fff;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            /* 保证标题在最上层 */
            position: relative;
        }
    </style>
</head>

<body>
    <div class="header">🌸 群 {{ group_name }} 今日老婆羁绊图谱 🌸</div>
    <div id="network-container"></div>

    <script>
        const hourlyTag = new Date().toISOString().slice(0, 13);
        const raw_data = {{ records | tojson }};
        const user_map = {{ user_map | tojson }} || {};
        const avatar_map = {{ avatar_map | tojson }} || {};
        const nodes = [];
        const edges = [];
        const userSet = new Set();

        raw_data.forEach(r => {
            const userName = user_map[r.user_id] || "用户" + r.user_id;
            const wifeName = user_map[r.wife_id] || r.wife_name;

            [{ id: r.user_id, name: userName }, { id: r.wife_id, name: wifeName }].forEach(u => {
                if (!userSet.has(u.id)) {
                    userSet.add(u.id);
                    nodes.push({
                        id: u.id,
                        label: u.name,
                        shape: 'circularImage',
                        image: avatar_map[u.id] || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="50" fill="%23ddd"/%3E%3C/svg%3E',
                        borderWidth: 6,
                        size: 110, // 放大头像 (50 -> 70)
                        color: { border: '#4facfe', background: '#ffffff' },
                        font: {
                            color: '#000000',
                            size: 50, // 放大文字 (18 -> 26)
                            vadjust: 40, // 调整文字偏移，适应大头像
                            strokeWidth: 6, // 增加描边
                            strokeColor: '#ffffff',
                            bold: { color: '#000000', size: 44, vadjust: 40 }
                        }
                    });
                }
            });

            edges.push({
                from: r.user_id,
                to: r.wife_id,
                label: r.forced ? "强娶" : "抽中",
                arrows: {to: {enabled: true,scaleFactor: 3,type: 'arrow'}},
                color: { color: r.forced ? '#ff4d4f' : '#1890ff', width: 4 },
                font: { align: 'middle', color: '#444', size: 48, background: '#ffffff' },
                length: 700 // 拉开节点间距
            });
        });

        const container = document.getElementById('network-container');
        const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
            nodes: {
                shape: 'circularImage',
                font: { face: 'Microsoft YaHei' }
            },
            edges: {
                smooth: {
                    type: 'curvedCW',
                    roundness: 0.2
                }
            },
            physics: {
                enabled: true,
                barnesHut: {
                    gravitationalConstant: -110000, // 进一步增大排斥力
                    centralGravity: 0.001,
                    springLength: 800, // 大幅增加弹簧长度
                    springConstant: 0.04,           // 弹簧强度，值越小越“软”，节点越容易被推开
                    damping: 0.09,
                    avoidOverlap: 1 // 防重叠参数，允许适当交叉，看着更自然
                },
                stabilization: {
                    enabled: true,
                    iterations: {{ iterations }},
                    updateInterval: 25,
                    onlyDynamicEdges: false,
                fit: true
                }
            }
        };
        const network = new vis.Network(container, data, options);
        network.once("stabilizationIterationsDone", function () {
            network.fit();
        });
    </script>
</body>

</html>
